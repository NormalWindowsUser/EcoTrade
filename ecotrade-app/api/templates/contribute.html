{% extends "base.html" %}

{% block content %}
<style>
    /* Card Container - Matching exact compact structure */
    .contribution-card {
        max-width: 520px;
        margin: 1.5rem auto 6rem; /* Bottom margin to ensure floating navbar never overlaps */
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 1.75rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .card-title {
        color: #047857;
        font-size: 1.4rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
    }

    .form-label {
        font-weight: 600;
        font-size: 0.88rem;
        color: #1e293b;
        margin-bottom: 0.35rem;
    }

    .input-group-search {
        position: relative;
        margin-bottom: 0.5rem;
    }

    .input-group-search svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
    }

    .input-group-search input {
        padding-left: 2.25rem;
        font-size: 0.9rem;
    }

    .form-control, .form-select {
        border-radius: 8px;
        border-color: #cbd5e1;
        padding: 0.6rem 0.75rem;
        font-size: 0.9rem;
    }

    .form-control:focus, .form-select:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.15);
    }

    .grid-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .cf-turnstile-wrapper {
        display: flex;
        justify-content: center;
        margin: 1rem 0;
    }

    .btn-submit {
        width: 100%;
        background-color: #059669;
        color: #ffffff;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem;
        border-radius: 8px;
        border: none;
        transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
        background-color: #047857;
    }
</style>

<div class="container">
    <div class="contribution-card">
        <!-- Title -->
        <h3 class="card-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            Submit Contribution
        </h3>

        <form action="/submit-contribution" method="POST" id="contributionForm">
            <!-- Hub Location Select -->
            <div class="mb-3">
                <label for="hubSearch" class="form-label">Select Recycling Hub Location</label>
                <div class="input-group-search">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="hubSearch" class="form-control" placeholder="Search hub name or city..." autocomplete="off">
                </div>
                <select id="hub_id" name="hub_id" class="form-select" required>
                    <option value="" disabled selected>Select a recycling center...</option>
                    {% for hub in hubs %}
                        <option value="{{ hub.id }}" data-city="{{ hub.city }}">{{ hub.name }} ({{ hub.city }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Material Select -->
            <div class="mb-3">
                <label for="material_id" class="form-label">Material Type</label>
                <select id="material_id" name="material_id" class="form-select" required>
                    <option value="" disabled selected data-rate="0">Select a material...</option>
                    {% for mat in materials %}
                        <option value="{{ mat.id }}" data-rate="{{ mat.avg_reported_rate or mat.base_rate or 0 }}">
                            {{ mat.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Side-by-Side: Weight and Total Payout -->
            <div class="grid-2col mb-3">
                <div>
                    <label for="weight" class="form-label">Weight (kg)</label>
                    <input type="number" id="weight" name="weight" class="form-control" placeholder="e.g. 2.5" min="0.1" step="0.1" required>
                </div>
                <div>
                    <label for="calculated_payout" class="form-label">Total Payout (RM)</label>
                    <input type="number" id="calculated_payout" name="calculated_payout" class="form-control" placeholder="0.00" min="0.00" step="0.01" required>
                </div>
            </div>

            <!-- Captcha -->
            <div class="cf-turnstile-wrapper">
                <div class="cf-turnstile" data-sitekey="{{ config.CF_TURNSTILE_SITE_KEY or '1x00000000000000000000AA' }}"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Submit Recycling Batch</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const hubSearch = document.getElementById('hubSearch');
        const hubSelect = document.getElementById('hub_id');
        const materialSelect = document.getElementById('material_id');
        const weightInput = document.getElementById('weight');
        const payoutInput = document.getElementById('calculated_payout');

        // Hub Search Filter
        if (hubSearch && hubSelect) {
            const originalOptions = Array.from(hubSelect.options);
            hubSearch.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                hubSelect.innerHTML = '';
                originalOptions.forEach(opt => {
                    const text = opt.text.toLowerCase();
                    const city = (opt.dataset.city || '').toLowerCase();
                    if (!term || text.includes(term) || city.includes(term) || opt.value === "") {
                        hubSelect.appendChild(opt.cloneNode(true));
                    }
                });
            });
        }

        // Auto-calculate total payout directly into calculated_payout field
        function calculatePayout() {
            const selectedOption = materialSelect.options[materialSelect.selectedIndex];
            const rate = parseFloat(selectedOption ? selectedOption.dataset.rate : 0) || 0;
            const weight = parseFloat(weightInput.value) || 0;
            
            payoutInput.value = (weight * rate).toFixed(2);
        }

        materialSelect.addEventListener('change', calculatePayout);
        weightInput.addEventListener('input', calculatePayout);
    });
</script>
{% endblock %}
