{% extends "base.html" %}

{% block content %}
<!-- Cloudflare Turnstile API Script -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card-custom p-4">
            <h4 class="fw-bold text-success mb-3"><i class="bi bi-plus-circle"></i> Submit Contribution</h4>
            
            <form id="contribForm">
                <!-- Recycling Center Search & Selection -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-light">Select Recycling Hub Location</label>
                    <input type="text" id="hubSearchInput" class="form-control bg-dark text-light border-secondary mb-2 form-control-sm" placeholder="🔍 Search hub name or city...">
                    <select class="form-select bg-dark text-light border-secondary" id="hubSelect" required>
                        <option value="" disabled selected>Loading locations...</option>
                    </select>
                </div>

                <!-- Selected Hub Location Info Card -->
                <div id="hubInfoCard" class="card-custom p-3 mb-3 d-none bg-dark border-secondary">
                    <div class="small text-success fw-bold mb-1" id="hubInfoName">--</div>
                    <div class="small text-secondary mb-1" id="hubInfoAddress"><i class="bi bi-geo-alt me-1"></i> --</div>
                    <div class="small text-muted" id="hubInfoHours"><i class="bi bi-clock me-1"></i> --</div>
                </div>

                <!-- Material Type Selection -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-light">Material Type</label>
                    <select class="form-select bg-dark text-light border-secondary" id="materialSelect" required>
                        <option value="Paper">Paper / Cardboard</option>
                        <option value="Plastic PET">Plastic PET Bottles</option>
                        <option value="Aluminum Cans">Aluminum Cans</option>
                        <option value="Used Cooking Oil">Used Cooking Oil</option>
                    </select>
                </div>

                <!-- Weight and Price Rate -->
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-light">Weight (kg)</label>
                        <input type="number" step="0.1" class="form-control bg-dark text-light border-secondary" id="weightInput" placeholder="e.g. 2.5" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-light">Rate (RM/kg)</label>
                        <input type="number" step="0.1" class="form-control bg-dark text-light border-secondary" id="priceInput" value="0.50" required>
                    </div>
                </div>

                <!-- Cloudflare Turnstile Anti-Bot Widget -->
                <div class="mb-3 text-center">
                    <!-- Always-passing test sitekey. Replace with your domain sitekey in production -->
                    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark"></div>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2">Submit Recycling Batch</button>
            </form>

            <div id="resultMsg" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    let hubsList = [];

    // Load available recycling hubs from API
    async function fetchHubs() {
        try {
            const res = await fetch('/api/hubs');
            const data = await res.json();
            if (data.status === 'success') {
                hubsList = data.data;
                renderHubOptions(hubsList);
            }
        } catch (e) {
            console.error('Error fetching hubs:', e);
        }
    }

    function renderHubOptions(list) {
        const select = document.getElementById('hubSelect');
        if (list.length === 0) {
            select.innerHTML = '<option value="" disabled selected>No matching hubs found</option>';
            return;
        }
        select.innerHTML = '<option value="" disabled selected>Select a recycling center...</option>' +
            list.map(h => `<option value="${h.id}">${h.name} (${h.city})</option>`).join('');
    }

    // Filter hubs dynamically by user input
    document.getElementById('hubSearchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = hubsList.filter(h => 
            h.name.toLowerCase().includes(query) || 
            h.city.toLowerCase().includes(query) ||
            h.address.toLowerCase().includes(query)
        );
        renderHubOptions(filtered);
    });

    // Display location details upon hub selection
    document.getElementById('hubSelect').addEventListener('change', (e) => {
        const selectedId = parseInt(e.target.value);
        const hub = hubsList.find(h => h.id === selectedId);
        const infoCard = document.getElementById('hubInfoCard');
        if (hub) {
            document.getElementById('hubInfoName').innerText = hub.name;
            document.getElementById('hubInfoAddress').innerHTML = `<i class="bi bi-geo-alt me-1"></i> ${hub.address}, ${hub.city}`;
            document.getElementById('hubInfoHours').innerHTML = `<i class="bi bi-clock me-1"></i> ${hub.hours}`;
            infoCard.classList.remove('d-none');
        } else {
            infoCard.classList.add('d-none');
        }
    });

    // Handle Form Submission with Turnstile Token
    document.getElementById('contribForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById('resultMsg');
        
        // Get Cloudflare Turnstile token
        const turnstileResponse = turnstile.getResponse();
        if (!turnstileResponse) {
            msgDiv.innerHTML = `<div class="alert alert-warning py-2 small">Please complete the anti-bot verification.</div>`;
            return;
        }

        const hubId = document.getElementById('hubSelect').value;
        if (!hubId) {
            msgDiv.innerHTML = `<div class="alert alert-warning py-2 small">Please select a recycling center.</div>`;
            return;
        }

        try {
            const res = await fetch('/api/contribute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cf_turnstile_response: turnstileResponse,
                    hub_id: parseInt(hubId),
                    material_name: document.getElementById('materialSelect').value,
                    weight: parseFloat(document.getElementById('weightInput').value),
                    price: parseFloat(document.getElementById('priceInput').value)
                })
            });
            const data = await res.json();
            if (data.status === 'success') {
                msgDiv.innerHTML = `<div class="alert alert-success py-2 small">Contribution recorded! Calculated Payout: <strong>RM ${data.payout.toFixed(2)}</strong></div>`;
                document.getElementById('contribForm').reset();
                document.getElementById('hubInfoCard').classList.add('d-none');
                turnstile.reset();
            } else {
                msgDiv.innerHTML = `<div class="alert alert-danger py-2 small">${data.message}</div>`;
                turnstile.reset();
            }
        } catch (err) {
            msgDiv.innerHTML = `<div class="alert alert-danger py-2 small">Submission error. Please try again.</div>`;
            turnstile.reset();
        }
    });

    document.addEventListener('DOMContentLoaded', fetchHubs);
</script>
{% endblock %}
