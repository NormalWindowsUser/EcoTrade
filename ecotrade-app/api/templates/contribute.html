{% extends "base.html" %}

{% block content %}
<!-- Cloudflare Turnstile API Script -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <!-- Main Form Card -->
        <div class="card bg-body border shadow-lg rounded-4 overflow-hidden">
            
            <!-- Card Header -->
            <div class="card-header bg-body border-bottom p-4 text-center">
                <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-2" style="width: 48px; height: 48px;">
                    <i class="bi bi-plus-circle fs-4"></i>
                </div>
                <h4 class="fw-bold text-success mb-1">Submit Contribution</h4>
                <p class="text-secondary small mb-0">Record recycling activity and update community payout logs.</p>
            </div>
            
            <div class="card-body p-4">
                <form id="contribForm">
                    <!-- Recycling Center Search & Selection -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-body">Select Recycling Hub Location</label>
                        <div class="input-group mb-2 shadow-sm rounded-3 overflow-hidden">
                            <span class="input-group-text bg-body-tertiary border-end-0 text-secondary"><i class="bi bi-search"></i></span>
                            <input type="text" id="hubSearchInput" class="form-control bg-body-tertiary border-start-0 text-body custom-input" placeholder="Search hub name or city...">
                        </div>
                        <select class="form-select bg-body-tertiary text-body border-0 shadow-sm custom-input" id="hubSelect" required style="padding: 0.6rem 0.75rem;">
                            <option value="" disabled selected>Loading locations...</option>
                        </select>
                    </div>

                    <!-- Selected Hub Location Info Card -->
                    <div id="hubInfoCard" class="card bg-success bg-opacity-10 border-success border-opacity-25 p-3 mb-4 rounded-3 d-none animate-fade-in">
                        <div class="d-flex align-items-start gap-2">
                            <i class="bi bi-geo-alt-fill text-success fs-5 mt-1"></i>
                            <div>
                                <div class="fw-bold text-success" id="hubInfoName">--</div>
                                <div class="small text-body opacity-75 mb-1" id="hubInfoAddress">--</div>
                                <div class="badge bg-success text-white fw-normal" id="hubInfoHours"><i class="bi bi-clock me-1"></i> --</div>
                            </div>
                        </div>
                    </div>

                    <!-- Material Type Selection -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-body">Material Type</label>
                        <select class="form-select bg-body-tertiary text-body border-0 shadow-sm custom-input" id="materialSelect" required style="padding: 0.6rem 0.75rem;">
                            <option value="" disabled selected>Loading materials...</option>
                        </select>
                    </div>

                    <!-- Weight and Price Rate -->
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label small fw-bold text-body">Weight (kg)</label>
                            <div class="input-group shadow-sm rounded-3 overflow-hidden">
                                <input type="number" step="0.1" class="form-control bg-body-tertiary border-end-0 text-body custom-input" id="weightInput" placeholder="0.0" required>
                                <span class="input-group-text bg-body-tertiary border-start-0 text-secondary small fw-bold">kg</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold text-body">Rate (RM/kg)</label>
                            <div class="input-group shadow-sm rounded-3 overflow-hidden">
                                <span class="input-group-text bg-body-tertiary border-end-0 text-secondary small fw-bold">RM</span>
                                <input type="number" step="0.1" class="form-control bg-body-tertiary border-start-0 text-body custom-input" id="priceInput" value="0.00" required>
                            </div>
                        </div>
                    </div>

                    <!-- Cloudflare Turnstile Anti-Bot Widget -->
                    <div class="mb-4 text-center d-flex justify-content-center">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEh_P3q35b1X2GRM"></div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm rounded-3 text-uppercase tracking-wider" style="letter-spacing: 0.5px;">
                        <i class="bi bi-check-circle me-1"></i> Submit Recycling Batch
                    </button>
                </form>

                <div id="resultMsg" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let hubsList = [];
    let materialsList = [];

    // --- HUB LOGIC ---
    async function fetchHubs() {
        try {
            const res = await fetch('/api/hubs');
            const data = await res.json();
            if (data.status === 'success') {
                hubsList = data.data;
                renderHubOptions(hubsList);
            }
        } catch (e) {
            console.error('Error fetching hubs:', e);
        }
    }

    function renderHubOptions(list) {
        const select = document.getElementById('hubSelect');
        if (list.length === 0) {
            select.innerHTML = '<option value="" disabled selected>No matching hubs found</option>';
            return;
        }
        select.innerHTML = '<option value="" disabled selected>Select a recycling center...</option>' +
            list.map(h => `<option value="${h.id}">${h.name} (${h.city})</option>`).join('');
    }

    document.getElementById('hubSearchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = hubsList.filter(h => 
            h.name.toLowerCase().includes(query) || 
            h.city.toLowerCase().includes(query) ||
            h.address.toLowerCase().includes(query)
        );
        renderHubOptions(filtered);
    });

    document.getElementById('hubSelect').addEventListener('change', (e) => {
        const selectedId = parseInt(e.target.value);
        const hub = hubsList.find(h => h.id === selectedId);
        const infoCard = document.getElementById('hubInfoCard');
        if (hub) {
            document.getElementById('hubInfoName').innerText = hub.name;
            document.getElementById('hubInfoAddress').innerText = `${hub.address}, ${hub.city}`;
            document.getElementById('hubInfoHours').innerHTML = `<i class="bi bi-clock me-1"></i> ${hub.hours}`;
            infoCard.classList.remove('d-none');
        } else {
            infoCard.classList.add('d-none');
        }
    });

    // --- MATERIAL LOGIC ---
    async function fetchMaterials() {
        try {
            const res = await fetch('/api/materials');
            const data = await res.json();
            if (data.status === 'success') {
                materialsList = data.data;
                renderMaterialOptions(materialsList);
            }
        } catch (e) {
            console.error('Error fetching materials:', e);
        }
    }

    function renderMaterialOptions(list) {
        const select = document.getElementById('materialSelect');
        
        const groupedMaterials = list.reduce((acc, material) => {
            if (!acc[material.category]) acc[material.category] = [];
            acc[material.category].push(material);
            return acc;
        }, {});

        let html = '<option value="" disabled selected>Select a material...</option>';
        
        for (const category in groupedMaterials) {
            html += `<optgroup label="${category}">`;
            groupedMaterials[category].forEach(m => {
                html += `<option value="${m.name}" data-price="${m.base_price}">${m.name}</option>`;
            });
            html += `</optgroup>`;
        }
        
        select.innerHTML = html;
    }

    document.getElementById('materialSelect').addEventListener('change', (e) => {
        const selectedOption = e.target.options[e.target.selectedIndex];
        const basePrice = selectedOption.getAttribute('data-price');
        
        if (basePrice) {
            document.getElementById('priceInput').value = parseFloat(basePrice).toFixed(2);
        }
    });

    // --- FORM SUBMISSION ---
    document.getElementById('contribForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById('resultMsg');
        
        const turnstileResponse = turnstile.getResponse();
        if (!turnstileResponse) {
            msgDiv.innerHTML = `<div class="alert alert-warning py-2 border-0 shadow-sm rounded-3 small"><i class="bi bi-exclamation-triangle me-1"></i> Please complete the anti-bot verification.</div>`;
            return;
        }

        const hubId = document.getElementById('hubSelect').value;
        if (!hubId) {
            msgDiv.innerHTML = `<div class="alert alert-warning py-2 border-0 shadow-sm rounded-3 small"><i class="bi bi-exclamation-triangle me-1"></i> Please select a recycling center.</div>`;
            return;
        }

        try {
            const res = await fetch('/api/contribute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cf_turnstile_response: turnstileResponse,
                    hub_id: parseInt(hubId),
                    material_name: document.getElementById('materialSelect').value,
                    weight: parseFloat(document.getElementById('weightInput').value),
                    price: parseFloat(document.getElementById('priceInput').value)
                })
            });
            const data = await res.json();
            if (data.status === 'success') {
                msgDiv.innerHTML = `<div class="alert alert-success py-2 border-0 shadow-sm rounded-3 small"><i class="bi bi-check-circle me-1"></i> Contribution recorded! Calculated Payout: <strong>RM ${data.payout.toFixed(2)}</strong></div>`;
                document.getElementById('contribForm').reset();
                document.getElementById('hubInfoCard').classList.add('d-none');
                turnstile.reset();
            } else {
                msgDiv.innerHTML = `<div class="alert alert-danger py-2 border-0 shadow-sm rounded-3 small"><i class="bi bi-x-circle me-1"></i> ${data.message}</div>`;
                turnstile.reset();
            }
        } catch (err) {
            msgDiv.innerHTML = `<div class="alert alert-danger py-2 border-0 shadow-sm rounded-3 small"><i class="bi bi-x-circle me-1"></i> Submission error. Please try again.</div>`;
            turnstile.reset();
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        fetchHubs();
        fetchMaterials();
    });
</script>

<style>
    .custom-input {
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .custom-input:focus {
        border-color: #198754 !important;
        box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15) !important;
    }
    .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
