{% extends "base.html" %}

{% block content %}
<!-- Cloudflare Turnstile API Script -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<div class="row justify-content-center py-3">
    <div class="col-md-8 col-lg-6">
        <div class="card bg-body border shadow-sm rounded-4 p-4">
            
            <!-- Header Section -->
            <div class="d-flex align-items-center gap-2 mb-4 pb-2 border-bottom">
                <i class="bi bi-plus-circle-fill text-success fs-4"></i>
                <div>
                    <h5 class="fw-bold mb-0">Submit Contribution</h5>
                    <small class="text-secondary">Log your recycling activity and view estimated payouts</small>
                </div>
            </div>

            <form id="contribForm">
                <!-- Section 1: Location Selection -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-body-secondary text-uppercase tracking-wide">1. Location</label>
                    <div class="position-relative mb-2">
                        <input type="text" id="hubSearchInput" class="form-control form-control-sm bg-body-tertiary border-secondary-subtle ps-4" placeholder="Search hub name or city...">
                        <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-2 text-secondary small"></i>
                    </div>
                    <select class="form-select bg-body-tertiary border-secondary-subtle" id="hubSelect" required>
                        <option value="" disabled selected>Loading locations...</option>
                    </select>
                </div>

                <!-- Selected Hub Location Info Card -->
                <div id="hubInfoCard" class="card bg-success-subtle border-success border-opacity-25 p-3 mb-4 d-none rounded-3">
                    <div class="small text-success fw-bold mb-1 d-flex align-items-center gap-1" id="hubInfoName">--</div>
                    <div class="small text-body-secondary mb-1" id="hubInfoAddress"><i class="bi bi-geo-alt me-1"></i> --</div>
                    <div class="small text-body-tertiary" id="hubInfoHours"><i class="bi bi-clock me-1"></i> --</div>
                </div>

                <!-- Section 2: Material & Weight Details -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-body-secondary text-uppercase tracking-wide">2. Recyclable Details</label>
                    <div class="mb-3">
                        <select class="form-select bg-body-tertiary border-secondary-subtle" id="materialSelect" required>
                            <option value="" disabled selected>Loading materials...</option>
                        </select>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-body-secondary">Weight (kg)</label>
                            <div class="input-group">
                                <input type="number" step="0.1" class="form-control bg-body-tertiary border-secondary-subtle" id="weightInput" placeholder="0.0" required>
                                <span class="input-group-text bg-body-tertiary text-secondary border-secondary-subtle">kg</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-body-secondary">Rate (RM/kg)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-body-tertiary text-secondary border-secondary-subtle">RM</span>
                                <input type="number" step="0.01" class="form-control bg-body-tertiary border-secondary-subtle" id="priceInput" value="0.00" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Security & Submission -->
                <div class="mb-3 text-center">
                    <div class="cf-turnstile d-inline-block" data-sitekey="0x4AAAAAAEh_P3q35b1X2GRM"></div>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2.5 rounded-3 shadow-sm">
                    Submit Recycling Batch
                </button>
            </form>

            <div id="resultMsg" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    let hubsList = [];
    let materialsList = [];

    // --- HUB LOGIC ---
    async function fetchHubs() {
        try {
            const res = await fetch('/api/hubs');
            const data = await res.json();
            if (data.status === 'success') {
                hubsList = data.data;
                renderHubOptions(hubsList);
            }
        } catch (e) {
            console.error('Error fetching hubs:', e);
        }
    }

    function renderHubOptions(list) {
        const select = document.getElementById('hubSelect');
        if (list.length === 0) {
            select.innerHTML = '<option value="" disabled selected>No matching hubs found</option>';
            return;
        }
        select.innerHTML = '<option value="" disabled selected>Select a recycling center...</option>' +
            list.map(h => `<option value="${h.id}">${h.name} (${h.city})</option>`).join('');
    }

    document.getElementById('hubSearchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = hubsList.filter(h => 
            h.name.toLowerCase().includes(query) || 
            h.city.toLowerCase().includes(query) ||
            h.address.toLowerCase().includes(query)
        );
        renderHubOptions(filtered);
    });

    document.getElementById('hubSelect').addEventListener('change', (e) => {
        const selectedId = parseInt(e.target.value);
        const hub = hubsList.find(h => h.id === selectedId);
        const infoCard = document.getElementById('hubInfoCard');
        if (hub) {
            document.getElementById('hubInfoName').innerHTML = `<i class="bi bi-building me-1"></i> ${hub.name}`;
            document.getElementById('hubInfoAddress').innerHTML = `<i class="bi bi-geo-alt me-1"></i> ${hub.address}, ${hub.city}`;
            document.getElementById('hubInfoHours').innerHTML = `<i class="bi bi-clock me-1"></i> ${hub.hours}`;
            infoCard.classList.remove('d-none');
        } else {
            infoCard.classList.add('d-none');
        }
    });

    // --- MATERIAL LOGIC ---
    async function fetchMaterials() {
        try {
            const res = await fetch('/api/materials');
            const data = await res.json();
            if (data.status === 'success') {
                materialsList = data.data;
                renderMaterialOptions(materialsList);
            }
        } catch (e) {
            console.error('Error fetching materials:', e);
        }
    }

    function renderMaterialOptions(list) {
        const select = document.getElementById('materialSelect');
        
        const groupedMaterials = list.reduce((acc, material) => {
            if (!acc[material.category]) acc[material.category] = [];
            acc[material.category].push(material);
            return acc;
        }, {});

        let html = '<option value="" disabled selected>Select material type...</option>';
        
        for (const category in groupedMaterials) {
            html += `<optgroup label="${category}">`;
            groupedMaterials[category].forEach(m => {
                html += `<option value="${m.name}" data-price="${m.base_price}">${m.name}</option>`;
            });
            html += `</optgroup>`;
        }
        
        select.innerHTML = html;
    }

    document.getElementById('materialSelect').addEventListener('change', (e) => {
        const selectedOption = e.target.options[e.target.selectedIndex];
        const basePrice = selectedOption.getAttribute('data-price');
        
        if (basePrice) {
            document.getElementById('priceInput').value = parseFloat(basePrice).toFixed(2);
        }
    });

    // --- FORM SUBMISSION ---
    document.getElementById('contribForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById('resultMsg');
        
        const turnstileResponse = turnstile.getResponse();
        if (!turnstileResponse) {
            msgDiv.innerHTML = `<div class="alert alert-warning py-2 small border-0 shadow-sm">Please complete the anti-bot verification.</div>`;
            return;
        }

        const hubId = document.getElementById('hubSelect').value;
        if (!hubId) {
            msgDiv.innerHTML = `<div class="alert alert-warning py-2 small border-0 shadow-sm">Please select a recycling center.</div>`;
            return;
        }

        try {
            const res = await fetch('/api/contribute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cf_turnstile_response: turnstileResponse,
                    hub_id: parseInt(hubId),
                    material_name: document.getElementById('materialSelect').value,
                    weight: parseFloat(document.getElementById('weightInput').value),
                    price: parseFloat(document.getElementById('priceInput').value)
                })
            });
            const data = await res.json();
            if (data.status === 'success') {
                msgDiv.innerHTML = `<div class="alert alert-success py-2 small border-0 shadow-sm">Contribution recorded! Calculated Payout: <strong>RM ${data.payout.toFixed(2)}</strong></div>`;
                document.getElementById('contribForm').reset();
                document.getElementById('hubInfoCard').classList.add('d-none');
                turnstile.reset();
            } else {
                msgDiv.innerHTML = `<div class="alert alert-danger py-2 small border-0 shadow-sm">${data.message}</div>`;
                turnstile.reset();
            }
        } catch (err) {
            msgDiv.innerHTML = `<div class="alert alert-danger py-2 small border-0 shadow-sm">Submission error. Please try again.</div>`;
            turnstile.reset();
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        fetchHubs();
        fetchMaterials();
    });
</script>
{% endblock %}
