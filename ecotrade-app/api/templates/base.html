<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>EcoTrade - Community</title>
    
    <!-- Browser Tab Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* DARK MODE DEFAULTS */
        :root, body {
            --bg-color: #0b0f19;
            --header-bg: #111827;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --nav-bg: rgba(17, 24, 39, 0.85);
            --nav-border: rgba(255, 255, 255, 0.12);
            --nav-text: #94a3b8;
            --input-bg: #1f2937;
            --input-text: #f8fafc;

            /* Map custom properties to Bootstrap 5 CSS variables */
            --bs-body-bg: var(--bg-color);
            --bs-body-color: var(--text-color);
            --bs-card-bg: var(--card-bg);
            --bs-border-color: var(--border-color);
            --bs-tertiary-bg: #1e293b;
            --bs-secondary-bg: #374151;
            --bs-secondary-color: var(--text-muted);
        }

        /* LIGHT MODE OVERRIDES */
        body.light-mode {
            --bg-color: #f8fafc;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --nav-border: rgba(0, 0, 0, 0.12);
            --nav-text: #475569;
            --input-bg: #ffffff;
            --input-text: #0f172a;

            /* Map custom light properties to Bootstrap 5 CSS variables */
            --bs-body-bg: var(--bg-color);
            --bs-body-color: var(--text-color);
            --bs-card-bg: var(--card-bg);
            --bs-border-color: var(--border-color);
            --bs-tertiary-bg: #f1f5f9;
            --bs-secondary-bg: #e2e8f0;
            --bs-secondary-color: var(--text-muted);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding-bottom: 140px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Ensure heading text dynamically responds to dark/light theme */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-color);
        }

        .header-bar {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .brand-logo {
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50px;
            padding: 4px 12px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }

        /* FLOATING GLASS NAVIGATION */
        .bottom-nav-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            width: auto;
            transition: all 0.2s ease;
        }

        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 8px;
            border-radius: 50px;
            border: 1px solid var(--nav-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        /* ALL NAV BUTTONS NOW FULLY ROUNDED ON ALL SIDES */
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--nav-text);
            text-decoration: none;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 50px !important; /* Fully rounded on all sides for every option */
            transition: all 0.2s ease;
        }

        .nav-btn-activity {
            display: none !important;
        }

        .nav-btn i {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        @media (max-width: 576px) {
            .bottom-nav-container {
                bottom: 0;
                left: 0;
                transform: none;
                width: 100%;
            }

            .bottom-nav {
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-bottom: none;
                justify-content: space-around;
                padding: 8px 4px;
                gap: 2px;
            }

            .nav-btn {
                padding-left: 10px;
                padding-right: 10px;
            }
        }

        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        /* DYNAMIC UTILITY OVERRIDES */
        .text-muted, .text-secondary {
            color: var(--text-muted) !important;
        }
        .text-light {
            color: var(--text-color) !important;
        }
        .bg-dark {
            background-color: var(--card-bg) !important;
        }
        .border-secondary {
            border-color: var(--border-color) !important;
        }
        
        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: var(--input-text) !important;
            border-color: var(--border-color) !important;
        }
        .form-control::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.7;
        }

        /* Table Overrides */
        .table {
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
        }
        .table th, .table td {
            background-color: var(--card-bg) !important;
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
        }
        .table-hover tbody tr:hover td {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
        }
    </style>
</head>
<body class="light-mode">

    <header class="header-bar">
        <a href="/" class="brand-logo text-decoration-none d-flex align-items-center gap-2">
            <i class="bi bi-recycle text-success" style="font-size: 1.5rem;"></i>
            <span class="fs-5 fw-bold" style="color: var(--text-color);">EcoTrade</span>
        </a>

        <div class="d-flex align-items-center gap-2">
            {% if session.get('user_id') %}
                <span class="badge bg-dark border border-secondary text-light px-2 py-1 small">
                    <i class="bi bi-person-circle text-success me-1"></i> {{ session.get('user_name') }}
                </span>
                <a href="/logout" class="btn btn-outline-danger btn-sm rounded-pill px-2 py-0" style="font-size: 0.75rem;">Logout</a>
            {% else %}
                <a href="/login" class="btn btn-outline-success btn-sm rounded-pill px-3 py-1" style="font-size: 0.75rem;">Log In</a>
            {% endif %}

            <button id="themeToggleBtn" class="theme-toggle-btn ms-1" onclick="toggleTheme()">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                <span id="themeLabel">Dark</span>
            </button>
        </div>
    </header>

    <main class="container py-3" style="max-width: 960px;">
        {% block content %}{% endblock %}
    </main>

    <div class="bottom-nav-container">
        <nav class="bottom-nav">
            <a href="/" class="nav-btn {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-house-door"></i>
                <span>HOME</span>
            </a>

            <a href="/activity" class="nav-btn nav-btn-activity {% if request.path == '/activity' %}active{% endif %}">
                <i class="bi bi-clock-history"></i>
                <span>ACTIVITY</span>
            </a>

            {% if session.get('user_role') == 'admin' %}
            <a href="/admin" class="nav-btn {% if request.path == '/admin' %}active{% endif %}">
                <i class="bi bi-shield-check"></i>
                <span>ADMIN</span>
            </a>
            {% endif %}

            <a href="/contribute" class="nav-btn {% if request.path == '/contribute' %}active{% endif %}">
                <i class="bi bi-plus-circle"></i>
                <span>CONTRIBUTE</span>
            </a>
            <a href="/chat" class="nav-btn {% if request.path == '/chat' %}active{% endif %}">
                <i class="bi bi-robot"></i>
                <span>AI CHAT</span>
            </a>
            <a href="/account" class="nav-btn {% if request.path == '/account' %}active{% endif %}">
                <i class="bi bi-person"></i>
                <span>ACCOUNT</span>
            </a>
        </nav>
    </div>

    <script>
        (function initTheme() {
            const savedTheme = localStorage.getItem('ecotrade-theme');
            if (savedTheme === 'dark') {
                document.body.classList.remove('light-mode');
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                updateThemeUI(false);
            } else {
                document.body.classList.add('light-mode');
                document.documentElement.setAttribute('data-bs-theme', 'light');
                updateThemeUI(true);
            }
        })();

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            const themeMode = isLight ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', themeMode);
            localStorage.setItem('ecotrade-theme', themeMode);
            updateThemeUI(isLight);
        }

        function updateThemeUI(isLight) {
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (isLight) {
                icon.className = 'bi bi-moon-stars-fill';
                label.innerText = 'Dark';
            } else {
                icon.className = 'bi bi-sun-fill';
                label.innerText = 'Light';
            }
        }
    </script>

</body>
</html>
