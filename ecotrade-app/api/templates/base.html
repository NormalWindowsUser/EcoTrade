<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrade - Community Recycling Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 90px;
        }

        .header-bar {
            background: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-weight: 700;
            font-size: 1.4rem;
            color: #10b981;
            text-decoration: none;
        }

        /* CENTERED FLOATING BOTTOM NAVIGATION */
        .bottom-nav-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: auto;
        }

        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: #1e293b;
            padding: 10px 24px;
            border-radius: 9999px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-btn i {
            font-size: 1.25rem;
            margin-bottom: 2px;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #10b981;
        }

        .nav-btn.btn-action {
            background-color: #10b981;
            color: #000;
            padding: 8px 16px;
            border-radius: 9999px;
            flex-direction: row;
            gap: 6px;
            font-size: 0.85rem;
        }

        .nav-btn.btn-action:hover {
            background-color: #059669;
            color: #fff;
        }

        .card-custom {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <a href="/" class="brand-logo"><i class="bi bi-recycle"></i> EcoTrade</a>
        <span class="badge bg-dark border border-secondary text-light px-3 py-2">Ahmad Razak (Student)</span>
    </header>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Centered Bottom Navigation Bar -->
    <div class="bottom-nav-container">
        <nav class="bottom-nav">
            <a href="/" class="nav-btn {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-house-door"></i>
                <span>HOME</span>
            </a>
            <a href="/admin" class="nav-btn {% if request.path == '/admin' %}active{% endif %}">
                <i class="bi bi-shield-check"></i>
                <span>ADMIN</span>
            </a>
            <a href="/contribute" class="nav-btn btn-action">
                <i class="bi bi-plus-circle-fill"></i>
                <span>CONTRIBUTE</span>
            </a>
            <a href="/chat" class="nav-btn {% if request.path == '/chat' %}active{% endif %}">
                <i class="bi bi-robot"></i>
                <span>AI CHAT</span>
            </a>
            <a href="/account" class="nav-btn {% if request.path == '/account' %}active{% endif %}">
                <i class="bi bi-person"></i>
                <span>ACCOUNT</span>
            </a>
        </nav>
    </div>

</body>
</html>
