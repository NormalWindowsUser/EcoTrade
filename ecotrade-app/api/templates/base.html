<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eco Recycling App{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Smooth scrolling across the application */
        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Bottom padding ensures page content scrolls above fixed bottom navbar */
            padding-bottom: 70px;
        }

        /* Hover animations for standard icon buttons */
        .icon-hover-btn {
            transition: all 0.2s ease-in-out;
        }
        .icon-hover-btn:hover {
            transform: translateY(-1px);
        }

        /* Active highlight styling for bottom navigation items */
        .nav-link-bottom {
            color: var(--bs-secondary-color);
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .nav-link-bottom:hover, .nav-link-bottom.active {
            color: #10b981 !important;
            transform: translateY(-1px);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-body text-body">

    <!-- Sticky Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-body border-bottom border-secondary-subtle shadow-sm z-3 py-2">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-success fs-5" href="/">
                <i class="bi bi-recycle fs-4"></i>
                <span>Eco Recycling</span>
            </a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar" aria-controls="topNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="topNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="/prices">Prices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium active text-success" href="/chat">Eco Assistant</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container (Unconstrained height allowing standard page scroll) -->
    <main class="flex-grow-1 container-fluid px-2 px-sm-3 px-md-4">
        {% block content %}
        <!-- Page-specific contents render here -->
        {% endblock %}
    </main>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="navbar fixed-bottom bg-body border-top border-secondary-subtle py-1 shadow-lg z-3">
        <div class="container d-flex justify-content-around align-items-center">
            <a href="/" class="nav-link-bottom d-flex flex-column align-items-center text-decoration-none py-1">
                <i class="bi bi-house-door fs-5"></i>
                <span style="font-size: 0.72rem;" class="fw-medium">Home</span>
            </a>
            <a href="/prices" class="nav-link-bottom d-flex flex-column align-items-center text-decoration-none py-1">
                <i class="bi bi-tag fs-5"></i>
                <span style="font-size: 0.72rem;" class="fw-medium">Prices</span>
            </a>
            <a href="/chat" class="nav-link-bottom active d-flex flex-column align-items-center text-decoration-none py-1">
                <i class="bi bi-robot fs-5"></i>
                <span style="font-size: 0.72rem;" class="fw-medium">Assistant</span>
            </a>
            <a href="/profile" class="nav-link-bottom d-flex flex-column align-items-center text-decoration-none py-1">
                <i class="bi bi-person fs-5"></i>
                <span style="font-size: 0.72rem;" class="fw-medium">Profile</span>
            </a>
        </div>
    </nav>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
