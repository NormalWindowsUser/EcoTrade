<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>EcoTrade - Community</title>
    
    <!-- Browser Tab Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
    
    <!-- Google Fonts: Geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* DARK MODE DEFAULTS */
        :root, body {
            --bg-color: #0b0f19;
            --header-bg: rgba(17, 24, 39, 0.85);
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --nav-bg: rgba(17, 24, 39, 0.75);
            --nav-border: rgba(255, 255, 255, 0.12);
            --nav-text: #94a3b8;
            --input-bg: #1f2937;
            --input-text: #f8fafc;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.15);

            /* Map custom properties to Bootstrap 5 CSS variables */
            --bs-body-bg: var(--bg-color);
            --bs-body-color: var(--text-color);
            --bs-card-bg: var(--card-bg);
            --bs-border-color: var(--border-color);
            --bs-tertiary-bg: #1e293b;
            --bs-secondary-bg: #374151;
            --bs-secondary-color: var(--text-muted);
        }

        /* LIGHT MODE OVERRIDES */
        body.light-mode {
            --bg-color: #f8fafc;
            --header-bg: rgba(255, 255, 255, 0.85);
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --nav-bg: rgba(255, 255, 255, 0.75);
            --nav-border: rgba(0, 0, 0, 0.08);
            --nav-text: #475569;
            --input-bg: #ffffff;
            --input-text: #0f172a;
            --accent-green: #059669;
            --accent-green-glow: rgba(5, 150, 105, 0.12);

            /* Map custom light properties to Bootstrap 5 CSS variables */
            --bs-body-bg: var(--bg-color);
            --bs-body-color: var(--text-color);
            --bs-card-bg: var(--card-bg);
            --bs-border-color: var(--border-color);
            --bs-tertiary-bg: #f1f5f9;
            --bs-secondary-bg: #e2e8f0;
            --bs-secondary-color: var(--text-muted);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            letter-spacing: -0.01em;
            padding-bottom: 140px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-color);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* ENSURE ICON STAYS INLINE WITH FIRST LINE OF TITLE */
        .title-with-icon {
            display: block;
        }
        
        .heading-icon-inline {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.35rem;
            margin-top: -0.15em;
        }

        /* GLASS HEADER */
        .header-bar {
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1040;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .brand-logo {
            text-decoration: none;
            display: flex;
            align-items: center;
            font-weight: 700;
            transition: transform 0.2s ease;
        }
        
        .brand-logo:hover {
            transform: translateY(-1px);
        }

        /* LOGOUT BUTTON - NO SHADOW ON HOVER */
        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 50px;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: border-width 0.15s ease, border-color 0.15s ease;
            box-sizing: border-box;
        }

        .btn-logout:hover {
            color: #ef4444;
            border: 2.5px solid #ef4444;
            padding: 2.5px 12.5px;
            box-shadow: none !important;
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50px;
            padding: 5px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: var(--accent-green-glow);
        }

        /* FLOATING GLASS NAVIGATION */
        .bottom-nav-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            width: auto;
            transition: all 0.3s ease;
        }

        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px;
            border-radius: 50px;
            border: 1px solid var(--nav-border);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .nav-btn {
            flex: 1 1 0px;
            min-width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--nav-text);
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 8px 16px;
            border-radius: 50px !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            white-space: nowrap;
        }

        .nav-btn-activity {
            display: none !important;
        }

        .nav-btn i {
            font-size: 1.15rem;
            margin-bottom: 3px;
            transition: transform 0.2s ease;
        }

        .nav-btn:hover i {
            transform: translateY(-2px);
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--accent-green);
            background: var(--accent-green-glow);
        }

        @media (max-width: 576px) {
            .bottom-nav-container {
                bottom: 0;
                left: 0;
                transform: none;
                width: 100%;
            }

            .bottom-nav {
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-bottom: none;
                justify-content: space-around;
                padding: 8px 4px;
                gap: 2px;
            }

            .nav-btn {
                min-width: 0;
                padding: 6px 8px;
            }
        }

        /* CARD STYLING */
        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-custom:hover {
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }

        /* WEIGHT STEPPER CONTROLS (+ / -) */
        .weight-stepper-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stepper-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .stepper-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: var(--accent-green-glow);
        }

        .stepper-btn:active {
            transform: scale(0.95);
        }

        /* DYNAMIC UTILITY OVERRIDES */
        .text-muted, .text-secondary {
            color: var(--text-muted) !important;
        }
        .text-light {
            color: var(--text-color) !important;
        }
        .bg-dark {
            background-color: var(--card-bg) !important;
        }
        .border-secondary {
            border-color: var(--border-color) !important;
        }
        
        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: var(--input-text) !important;
            border-color: var(--border-color) !important;
            border-radius: 10px;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 0 3px var(--accent-green-glow) !important;
        }

        .form-control::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.7;
        }

        /* Table Overrides */
        .table {
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
        }
        .table th, .table td {
            background-color: var(--card-bg) !important;
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
            padding: 0.85rem 1rem;
        }
        .table-hover tbody tr:hover td {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
        }
    </style>
</head>
<body class="light-mode">

    <header class="header-bar">
        <a href="/" class="brand-logo text-decoration-none d-flex align-items-center gap-2">
            <i class="bi bi-recycle text-success" style="font-size: 1.5rem;"></i>
            <span class="fs-5 fw-bold" style="color: var(--text-color);">EcoTrade</span>
        </a>

        <div class="d-flex align-items-center gap-2">
            {% if session.get('user_id') %}
                <span class="badge bg-dark border border-secondary text-light px-3 py-2 rounded-pill small me-1 fw-medium">
                    <i class="bi bi-person-circle text-success me-1"></i> {{ session.get('user_name') }}
                </span>
                <a href="/logout" class="btn-logout">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            {% else %}
                <a href="/login" class="btn btn-outline-success btn-sm rounded-pill px-3 py-1 fw-semibold" style="font-size: 0.75rem;">Log In</a>
            {% endif %}

            <button id="themeToggleBtn" class="theme-toggle-btn ms-1" onclick="toggleTheme()">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                <span id="themeLabel">Dark</span>
            </button>
        </div>
    </header>

    <main class="container py-4" style="max-width: 960px;">
        {% block content %}{% endblock %}
    </main>

    <div class="bottom-nav-container">
        <nav class="bottom-nav">
            <a href="/" class="nav-btn {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-house-door"></i>
                <span>HOME</span>
            </a>

            <a href="/activity" class="nav-btn nav-btn-activity {% if request.path == '/activity' %}active{% endif %}">
                <i class="bi bi-clock-history"></i>
                <span>ACTIVITY</span>
            </a>

            {% if session.get('user_role') == 'admin' %}
            <a href="/admin" class="nav-btn {% if request.path == '/admin' %}active{% endif %}">
                <i class="bi bi-shield-check"></i>
                <span>ADMIN</span>
            </a>
            {% endif %}

            <a href="/contribute" class="nav-btn {% if request.path == '/contribute' %}active{% endif %}">
                <i class="bi bi-plus-circle"></i>
                <span>CONTRIBUTE</span>
            </a>
            <a href="/chat" class="nav-btn {% if request.path == '/chat' %}active{% endif %}">
                <i class="bi bi-robot"></i>
                <span>AI CHAT</span>
            </a>
            <a href="/account" class="nav-btn {% if request.path == '/account' %}active{% endif %}">
                <i class="bi bi-person"></i>
                <span>ACCOUNT</span>
            </a>
        </nav>
    </div>

    <script>
        (function initTheme() {
            const savedTheme = localStorage.getItem('ecotrade-theme');
            if (savedTheme === 'dark') {
                document.body.classList.remove('light-mode');
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                updateThemeUI(false);
            } else {
                document.body.classList.add('light-mode');
                document.documentElement.setAttribute('data-bs-theme', 'light');
                updateThemeUI(true);
            }
        })();

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            const themeMode = isLight ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', themeMode);
            localStorage.setItem('ecotrade-theme', themeMode);
            updateThemeUI(isLight);
        }

        function updateThemeUI(isLight) {
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (isLight) {
                icon.className = 'bi bi-moon-stars-fill';
                label.innerText = 'Dark';
            } else {
                icon.className = 'bi bi-sun-fill';
                label.innerText = 'Light';
            }
        }

        // Global Helper for Weight Increment/Decrement buttons
        function adjustWeight(inputId, amount) {
            const input = document.getElementById(inputId);
            if (input) {
                let val = parseFloat(input.value) || 0;
                val = Math.max(0, parseFloat((val + amount).toFixed(1)));
                input.value = val;
                input.dispatchEvent(new Event('change'));
            }
        }
    </script>

</body>
</html>
