{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card-custom p-4">
            <h3 class="fw-bold text-success mb-3"><i class="bi bi-robot"></i> AI Eco Assistant</h3>
            <div id="chatBox" class="p-3 mb-3 bg-dark rounded border border-secondary" style="height: 300px; overflow-y: auto;">
                <p class="text-secondary">Ask questions about material prices, preparation tips, or recycling impact!</p>
            </div>
            <div class="input-group">
                <input type="text" id="chatInput" class="form-control bg-dark text-light border-secondary" placeholder="Ask AI anything about recycling...">
                <button class="btn btn-success" id="sendBtn">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const box = document.getElementById('chatBox');
        if (!input.value.trim()) return;

        const userMsg = input.value.trim();
        box.innerHTML += `<p><strong>You:</strong> ${userMsg}</p>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: userMsg })
            });
            const data = await res.json();
            box.innerHTML += `<p class="text-success"><strong>Eco AI:</strong> ${data.reply}</p>`;
        } catch (err) {
            box.innerHTML += `<p class="text-danger"><strong>System:</strong> Failed to reach AI service.</p>`;
        }
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);

    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
{% endblock %}
