{% extends "base.html" %}

{% block content %}
<!-- Include Marked.js to render AI Markdown responses into HTML -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold text-success mb-0"><i class="bi bi-robot"></i> AI Eco Assistant</h3>
                <button class="btn btn-outline-danger btn-sm" id="clearBtn"><i class="bi bi-trash"></i> Clear Chat</button>
            </div>
            
            <div id="chatBox" class="p-3 mb-3 bg-dark rounded border border-secondary" style="height: 380px; overflow-y: auto;">
                <p class="text-secondary small mb-0" id="defaultWelcome">Ask questions about material prices, preparation tips, or recycling impact!</p>
            </div>
            
            <div class="input-group">
                <input type="text" id="chatInput" class="form-control bg-dark text-light border-secondary" placeholder="Ask AI anything about recycling...">
                <button class="btn btn-success fw-bold px-4" id="sendBtn">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'eco_ai_chat_history';

    // Load saved messages on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadSavedHistory();
    });

    function saveMessageToHistory(role, content) {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        history.push({ role, content, timestamp: new Date().toISOString() });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function loadSavedHistory() {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        if (history.length > 0) {
            const defaultWelcome = document.getElementById('defaultWelcome');
            if (defaultWelcome) defaultWelcome.remove();
            
            history.forEach(item => {
                if (item.role === 'user') {
                    renderUserBubble(item.content);
                } else if (item.role === 'ai') {
                    renderAiBubble(item.content);
                }
            });
            const box = document.getElementById('chatBox');
            box.scrollTop = box.scrollHeight;
        }
    }

    function renderUserBubble(text) {
        const box = document.getElementById('chatBox');
        box.innerHTML += `
            <div class="mb-3 text-end">
                <span class="badge bg-secondary mb-1">You</span>
                <div class="p-2 px-3 bg-secondary bg-opacity-20 rounded text-light d-inline-block text-start" style="max-width: 85%;">
                    ${escapeHtml(text)}
                </div>
            </div>
        `;
    }

    function renderAiBubble(markdownContent) {
        const box = document.getElementById('chatBox');
        const parsedHtml = marked.parse(markdownContent);
        box.innerHTML += `
            <div class="mb-3 text-start">
                <span class="badge bg-success mb-1"><i class="bi bi-robot"></i> Eco AI</span>
                <div class="p-3 bg-dark border border-secondary rounded text-light ai-reply-content">
                    ${parsedHtml}
                </div>
            </div>
        `;
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const box = document.getElementById('chatBox');
        if (!input.value.trim()) return;

        const defaultWelcome = document.getElementById('defaultWelcome');
        if (defaultWelcome) defaultWelcome.remove();

        const userMsg = input.value.trim();
        
        // Render & Save User Message
        renderUserBubble(userMsg);
        saveMessageToHistory('user', userMsg);

        input.value = '';
        box.scrollTop = box.scrollHeight;

        // Render Animated Thinking Indicator
        const loadingId = 'loading-' + Date.now();
        box.innerHTML += `
            <div id="${loadingId}" class="mb-3 text-start">
                <span class="badge bg-success mb-1"><i class="bi bi-robot spin-icon"></i> Eco AI</span>
                <div class="p-2 px-3 bg-dark border border-secondary rounded text-light d-inline-block thinking-bubble">
                    <span class="spinner-grow spinner-grow-sm text-success me-2" role="status"></span>
                    <span class="text-secondary small me-1">Thinking</span>
                    <span class="typing-dots">
                        <span>.</span><span>.</span><span>.</span>
                    </span>
                </div>
            </div>
        `;
        box.scrollTop = box.scrollHeight;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: userMsg })
            });
            const data = await res.json();
            
            document.getElementById(loadingId)?.remove();

            if (data.status === 'success') {
                // Render & Save AI Response
                renderAiBubble(data.reply);
                saveMessageToHistory('ai', data.reply);
            } else {
                box.innerHTML += `
                    <div class="mb-3 text-start">
                        <div class="alert alert-danger py-2 small mb-0">${data.reply || 'AI service error.'}</div>
                    </div>
                `;
            }
        } catch (err) {
            document.getElementById(loadingId)?.remove();
            box.innerHTML += `
                <div class="mb-3 text-start">
                    <div class="alert alert-danger py-2 small mb-0">Connection error. Please try again.</div>
                </div>
            `;
        }
        box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);

    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('chatBox').innerHTML = `
            <p class="text-secondary small mb-0" id="defaultWelcome">Ask questions about material prices, preparation tips, or recycling impact!</p>
        `;
    });
</script>

<style>
    /* Styling for rendered AI Markdown content */
    .ai-reply-content p:last-child {
        margin-bottom: 0;
    }
    .ai-reply-content ul, .ai-reply-content ol {
        padding-left: 1.25rem;
        margin-bottom: 0.5rem;
    }
    .ai-reply-content h1, .ai-reply-content h2, .ai-reply-content h3, .ai-reply-content h4 {
        font-size: 1rem;
        font-weight: bold;
        color: #198754;
        margin-top: 0.5rem;
        margin-bottom: 0.25rem;
    }
    .ai-reply-content hr {
        margin: 0.5rem 0;
        border-color: #495057;
    }

    /* Thinking state animation styles */
    .thinking-bubble {
        animation: pulseBorder 1.5s infinite ease-in-out;
    }

    .spin-icon {
        display: inline-block;
        animation: subtleRotate 2s infinite linear;
    }

    .typing-dots span {
        display: inline-block;
        font-weight: bold;
        color: #198754;
        animation: waveDots 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes pulseBorder {
        0%, 100% {
            border-color: #495057 !important;
            box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.2);
        }
        50% {
            border-color: #198754 !important;
            box-shadow: 0 0 8px 0 rgba(25, 135, 84, 0.4);
        }
    }

    @keyframes subtleRotate {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes waveDots {
        0%, 100% {
            transform: translateY(0);
            opacity: 0.4;
        }
        50% {
            transform: translateY(-3px);
            opacity: 1;
        }
    }
</style>
{% endblock %}
