{% extends "base.html" %}

{% block content %}
<!-- Include Marked.js to render AI Markdown responses into HTML -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Full Page AI Layout Container -->
<div class="ai-page-wrapper d-flex flex-column pb-3">
    
    <!-- Top Header Controls (Centered layout as requested) -->
    <div id="aiHeader" class="ai-header flex-column align-items-center justify-content-center text-center pb-3 border-bottom border-secondary mb-3 position-relative d-none">
        <div class="d-flex flex-column align-items-center justify-content-center">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-2" style="width: 48px; height: 48px;">
                <i class="bi bi-robot fs-3"></i>
            </div>
            <h5 class="fw-bold text-success mb-1 lh-1 fs-4">Eco Assistant</h5>
            <small class="text-secondary" style="font-size: 0.8rem;">AI-powered recycling guide</small>
        </div>
        
        <button class="btn btn-outline-danger btn-sm rounded-pill px-3 py-1 icon-hover-btn position-absolute top-0 end-0 d-flex align-items-center gap-1" id="clearBtn" title="Clear chat history">
            <i class="bi bi-trash"></i>
            <span class="d-none d-sm-inline">Clear History</span>
        </button>
    </div>
    
    <!-- Empty State View (Centered Landing View) -->
    <div id="landingView" class="d-flex flex-column justify-content-center align-items-center flex-grow-1 w-100 my-auto py-4">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 64px; height: 64px;">
                <i class="bi bi-robot fs-1"></i>
            </div>
            <h2 class="fw-bold text-body mb-1">Welcome to Eco Assistant</h2>
            <p class="text-secondary mb-0">Your AI-powered recycling & sustainability guide</p>
        </div>

        <!-- Input Box inside Landing View -->
        <div class="w-100" style="max-width: 680px;">
            <div class="bg-body-tertiary border border-secondary rounded-4 p-3 shadow-sm position-relative custom-input-box mb-3">
                <textarea id="landingChatInput" class="form-control border-0 shadow-none p-0 text-body custom-textarea-bg" rows="2" placeholder="Ask AI anything about recycling..."></textarea>
                
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <button class="btn btn-body-tertiary rounded-circle p-0 text-secondary border-0 icon-hover-btn d-inline-flex align-items-center justify-content-center reset-input-btn" type="button" title="Clear input text" style="width: 36px; height: 36px;">
                        <i class="bi bi-x-lg fs-6 lh-1"></i>
                    </button>
                    
                    <button class="btn btn-success rounded-circle p-0 shadow-sm d-inline-flex align-items-center justify-content-center landing-send-btn" type="button" title="Send message" style="width: 40px; height: 40px;">
                        <i class="bi bi-arrow-up-short fs-3 text-white lh-1"></i>
                    </button>
                </div>
            </div>

            <!-- Custom Prompt Suggestion Chips (Pre-fills text into input with clean icon gaps) -->
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button class="btn btn-outline-secondary rounded-pill btn-sm prompt-chip px-3 py-2 d-inline-flex align-items-center gap-2" data-template="Scrap metal and plastic market prices for ">
                    <i class="bi bi-currency-dollar text-success fs-6"></i>
                    <span>Material Prices</span>
                </button>
                <button class="btn btn-outline-secondary rounded-pill btn-sm prompt-chip px-3 py-2 d-inline-flex align-items-center gap-2" data-template="Preparation steps before recycling ">
                    <i class="bi bi-box-seam text-info fs-6"></i>
                    <span>Preparation Tips</span>
                </button>
                <button class="btn btn-outline-secondary rounded-pill btn-sm prompt-chip px-3 py-2 d-inline-flex align-items-center gap-2" data-template="Environmental carbon impact of recycling ">
                    <i class="bi bi-tree text-success fs-6"></i>
                    <span>Eco Impact</span>
                </button>
                <button class="btn btn-outline-secondary rounded-pill btn-sm prompt-chip px-3 py-2 d-inline-flex align-items-center gap-2" data-template="Recycling centers near ">
                    <i class="bi bi-geo-alt text-warning fs-6"></i>
                    <span>Disposal Centers</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Active Chat Stream Container -->
    <div id="chatBox" class="ai-chat-stream flex-grow-1 custom-scrollbar px-2 overflow-y-auto d-none">
    </div>
    
    <!-- Floating Bottom Input Console (Active Chat Mode) -->
    <div id="activeInputWrapper" class="ai-input-wrapper pt-2 mt-auto mb-2 d-none">
        <div class="bg-body-tertiary border border-secondary rounded-4 p-3 shadow-sm position-relative custom-input-box">
            <textarea id="activeChatInput" class="form-control border-0 shadow-none p-0 text-body custom-textarea-bg" rows="2" placeholder="Ask AI anything about recycling..."></textarea>
            
            <div class="d-flex justify-content-between align-items-center mt-2">
                <button class="btn btn-body-tertiary rounded-circle p-0 text-secondary border-0 icon-hover-btn d-inline-flex align-items-center justify-content-center reset-input-btn" type="button" title="Clear input text" style="width: 36px; height: 36px;">
                    <i class="bi bi-x-lg fs-6 lh-1"></i>
                </button>
                
                <button class="btn btn-success rounded-circle p-0 shadow-sm d-inline-flex align-items-center justify-content-center active-send-btn" type="button" title="Send message" style="width: 40px; height: 40px;">
                    <i class="bi bi-arrow-up-short fs-3 text-white lh-1"></i>
                </button>
            </div>
        </div>
    </div>

</div>

<script>
    const STORAGE_KEY = 'eco_ai_chat_history';
    let isGenerating = false;

    document.addEventListener('DOMContentLoaded', () => {
        loadSavedHistory();
        setupEventListeners();
    });

    function saveMessageToHistory(role, content) {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        history.push({ role, content, timestamp: new Date().toISOString() });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function showChatView() {
        document.getElementById('landingView').classList.add('d-none');
        document.getElementById('landingView').classList.remove('d-flex');
        
        document.getElementById('aiHeader').classList.remove('d-none');
        document.getElementById('aiHeader').classList.add('d-flex');
        
        document.getElementById('chatBox').classList.remove('d-none');
        document.getElementById('activeInputWrapper').classList.remove('d-none');
    }

    function showLandingView() {
        document.getElementById('landingView').classList.remove('d-none');
        document.getElementById('landingView').classList.add('d-flex');
        
        document.getElementById('aiHeader').classList.add('d-none');
        document.getElementById('aiHeader').classList.remove('d-flex');
        
        document.getElementById('chatBox').classList.add('d-none');
        document.getElementById('activeInputWrapper').classList.add('d-none');
        document.getElementById('chatBox').innerHTML = '';
        document.getElementById('landingChatInput').value = '';
    }

    function loadSavedHistory() {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        if (history.length > 0) {
            showChatView();
            history.forEach(item => {
                if (item.role === 'user') {
                    renderUserBubble(item.content);
                } else if (item.role === 'ai') {
                    renderAiBubble(item.content, false);
                }
            });
            scrollToBottom();
        } else {
            showLandingView();
        }
    }

    function setInputState(disabled) {
        isGenerating = disabled;
        const inputs = [document.getElementById('landingChatInput'), document.getElementById('activeChatInput')];
        const buttons = document.querySelectorAll('.landing-send-btn, .active-send-btn, .reset-input-btn, .prompt-chip');

        inputs.forEach(input => { if (input) input.disabled = disabled; });
        buttons.forEach(btn => {
            btn.disabled = disabled;
            if (disabled) btn.classList.add('opacity-50');
            else btn.classList.remove('opacity-50');
        });

        if (!disabled) {
            const activeInput = document.getElementById('chatBox').classList.contains('d-none') 
                ? document.getElementById('landingChatInput') 
                : document.getElementById('activeChatInput');
            activeInput?.focus();
        }
    }

    function scrollToBottom() {
        const box = document.getElementById('chatBox');
        box.scrollTop = box.scrollHeight;
    }

    function renderUserBubble(text) {
        const box = document.getElementById('chatBox');
        box.innerHTML += `
            <div class="d-flex justify-content-end mb-4 animate-fade-in pe-2">
                <div class="user-bubble px-4 py-2" style="max-width: 80%; font-size: 0.95rem; background-color: #10b981; color: #ffffff; border-radius: 20px; word-break: break-word;">
                    ${escapeHtml(text)}
                </div>
            </div>
        `;
    }

    function renderAiBubble(markdownContent, animate = true) {
        const box = document.getElementById('chatBox');
        const bubbleId = 'ai-msg-' + Date.now();
        const copyBtnId = 'copy-btn-' + Date.now();
        
        const wrapper = document.createElement('div');
        wrapper.className = 'd-flex justify-content-start mb-4 animate-fade-in ps-2';
        wrapper.innerHTML = `
            <div class="d-flex flex-column align-items-start" style="max-width: 90%; word-break: break-word;">
                <div id="${bubbleId}" class="ai-reply-content text-body" style="font-size: 0.95rem; line-height: 1.6;"></div>
                <div class="mt-1">
                    <button class="btn btn-link text-secondary p-0 border-0 me-2" id="${copyBtnId}" title="Copy message" style="font-size: 0.9rem;">
                        <i class="bi bi-copy"></i>
                    </button>
                </div>
            </div>
        `;

        if (!animate) {
            box.appendChild(wrapper);
            document.getElementById(bubbleId).innerHTML = marked.parse(markdownContent);
            attachCopyHandler(copyBtnId, markdownContent);
            return;
        }

        box.appendChild(wrapper);
        const targetElem = document.getElementById(bubbleId);
        let index = 0;
        const typingSpeed = 12;

        function typeChar() {
            if (index < markdownContent.length) {
                index++;
                const currentText = markdownContent.substring(0, index);
                targetElem.innerHTML = marked.parse(currentText);
                scrollToBottom();
                setTimeout(typeChar, typingSpeed);
            } else {
                attachCopyHandler(copyBtnId, markdownContent);
                setInputState(false);
            }
        }

        typeChar();
    }

    function attachCopyHandler(btnId, text) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btn.querySelector('i');
                icon.className = 'bi bi-check2 text-success';
                setTimeout(() => { icon.className = 'bi bi-copy'; }, 2000);
            });
        });
    }

    async function sendMessage() {
        if (isGenerating) return;

        const landingInput = document.getElementById('landingChatInput');
        const activeInput = document.getElementById('activeChatInput');
        const userMsg = document.getElementById('chatBox').classList.contains('d-none') ? landingInput.value.trim() : activeInput.value.trim();

        if (!userMsg) return;

        showChatView();
        setInputState(true);

        renderUserBubble(userMsg);
        saveMessageToHistory('user', userMsg);

        landingInput.value = '';
        activeInput.value = '';
        scrollToBottom();

        const box = document.getElementById('chatBox');
        const loadingId = 'loading-' + Date.now();
        box.innerHTML += `
            <div id="${loadingId}" class="d-flex justify-content-start mb-4 animate-fade-in ps-2">
                <div class="text-secondary thinking-bubble py-1" style="font-size: 0.9rem;">
                    <span class="spinner-grow spinner-grow-sm text-success me-2" role="status"></span>
                    <span class="me-1">Eco AI is thinking</span>
                    <span class="typing-dots">
                        <span>.</span><span>.</span><span>.</span>
                    </span>
                </div>
            </div>
        `;
        scrollToBottom();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: userMsg })
            });
            const data = await res.json();
            
            document.getElementById(loadingId)?.remove();

            if (data.status === 'success') {
                renderAiBubble(data.reply, true);
                saveMessageToHistory('ai', data.reply);
            } else {
                box.innerHTML += `
                    <div class="d-flex justify-content-center mb-3">
                        <div class="alert alert-danger py-2 small mb-0 rounded-pill shadow-sm">${data.reply || 'AI service error.'}</div>
                    </div>
                `;
                setInputState(false);
            }
        } catch (err) {
            document.getElementById(loadingId)?.remove();
            box.innerHTML += `
                <div class="d-flex justify-content-center mb-3">
                    <div class="alert alert-danger py-2 small mb-0 rounded-pill shadow-sm"><i class="bi bi-exclamation-triangle"></i> Connection error. Please try again.</div>
                </div>
            `;
            setInputState(false);
        }
        scrollToBottom();
    }

    function setupEventListeners() {
        document.querySelectorAll('.landing-send-btn, .active-send-btn').forEach(btn => {
            btn.addEventListener('click', () => sendMessage());
        });

        /* Option Chip Event: Inserts pre-filled text template into input instead of immediate sending */
        document.querySelectorAll('.prompt-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const template = chip.getAttribute('data-template');
                const targetInput = document.getElementById('chatBox').classList.contains('d-none')
                    ? document.getElementById('landingChatInput')
                    : document.getElementById('activeChatInput');
                
                targetInput.value = template;
                targetInput.focus();
                // Set cursor position to end of input box
                targetInput.setSelectionRange(targetInput.value.length, targetInput.value.length);
            });
        });

        document.querySelectorAll('.reset-input-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isGenerating) return;
                document.getElementById('landingChatInput').value = '';
                document.getElementById('activeChatInput').value = '';
            });
        });

        const handleEnterKey = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        document.getElementById('landingChatInput').addEventListener('keydown', handleEnterKey);
        document.getElementById('activeChatInput').addEventListener('keydown', handleEnterKey);

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (isGenerating) return;
            localStorage.removeItem(STORAGE_KEY);
            showLandingView();
        });
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

<style>
    .ai-page-wrapper {
        height: calc(100vh - 140px);
        width: 100%;
    }

    .custom-textarea-bg {
        background-color: transparent !important;
    }

    .custom-input-box {
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .custom-input-box:focus-within {
        border-color: #10b981 !important;
        box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.15) !important;
    }

    .prompt-chip {
        font-size: 0.85rem;
        transition: all 0.2s ease;
        border-color: var(--bs-border-color);
        background-color: var(--bs-body-bg);
        color: var(--bs-body-color);
    }
    .prompt-chip i {
        margin-right: 0.15rem;
    }
    .prompt-chip:hover {
        border-color: #10b981;
        background-color: rgba(16, 185, 129, 0.08);
        color: var(--bs-body-color);
        transform: translateY(-1px);
    }

    #landingChatInput, #activeChatInput {
        resize: none;
    }
    #landingChatInput::placeholder, #activeChatInput::placeholder {
        color: var(--bs-secondary-color);
    }

    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--bs-border-color);
        border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: var(--bs-secondary-color);
    }

    .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .ai-reply-content {
        line-height: 1.6;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }
    .ai-reply-content p:last-child {
        margin-bottom: 0;
    }
    .ai-reply-content ul, .ai-reply-content ol {
        padding-left: 1.25rem;
        margin-bottom: 0.5rem;
    }
    .ai-reply-content h1, .ai-reply-content h2, .ai-reply-content h3, .ai-reply-content h4 {
        font-size: 1.05rem;
        font-weight: 700;
        color: #10b981;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
    }
    .ai-reply-content h1:first-child, .ai-reply-content h2:first-child, .ai-reply-content h3:first-child {
        margin-top: 0;
    }

    .ai-reply-content code {
        background-color: rgba(16, 185, 129, 0.1);
        color: #10b981;
        padding: 0.15rem 0.4rem;
        border-radius: 0.3rem;
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875em;
    }

    .ai-reply-content pre {
        background-color: #1e1e1e;
        color: #d4d4d4;
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin-top: 0.5rem;
        margin-bottom: 0.75rem;
    }
    .ai-reply-content pre code {
        background-color: transparent !important;
        color: inherit !important;
        padding: 0 !important;
        border-radius: 0 !important;
    }

    .typing-dots span {
        display: inline-block;
        font-weight: bold;
        color: #10b981;
        animation: waveDots 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes waveDots {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-3px); opacity: 1; }
    }
</style>
{% endblock %}
